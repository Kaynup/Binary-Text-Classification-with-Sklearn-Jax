# Prometheus Scrape Configuration for Sentiment Analyzer API
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "sentiment_analyzer_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000", "localhost:8000", "backend:8000"]
        labels:
          app: "sentiment-analyzer"
          env: "production"
          version: "2.0.0"
